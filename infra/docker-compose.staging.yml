version: '3.8'

services:
  # ==========================================
  # Databases (Internal Only)
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_db

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: inventory_db

  mongo-db:
    image: mongo:6-jammy

  # ==========================================
  # Applications
  # ==========================================
  order-service:
    build:
      context: ../app/order-service
    env_file:
      - ../app/order-service/.env
    depends_on:
      - postgres-db

  inventory-service:
    build:
      context: ../app/inventory-service
    env_file:
      - ../app/inventory-service/.env
    depends_on:
      - mysql-db

  notification-service:
    build:
      context: ../app/notification-service
    env_file:
      - ../app/notification-service/.env
    depends_on:
      - mongo-db

  # ==========================================
  # NGINX Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - order-service
      - inventory-service
      - notification-service

  # ==========================================
  # Certbot SSL
  # ==========================================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot_conf:
  certbot_www:
