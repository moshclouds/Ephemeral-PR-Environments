name: Clone DB Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number
      order_changed:
        description: "Order service changed"
        required: true
        type: string
      inventory_changed:
        description: "Inventory service changed"
        required: true
        type: string
      notification_changed:
        description: "Notification service changed"
        required: true
        type: string

jobs:
  clone-db:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Clone Order DB
        if: inputs.order_changed == 'true'
        run: bash ./scripts/clone_db.sh order-service ${{ inputs.pr_number }}

      - name: Clone Inventory DB
        if: inputs.inventory_changed == 'true'
        run: bash ./scripts/clone_db.sh inventory-service ${{ inputs.pr_number }}

      - name: Clone Notification DB
        if: inputs.notification_changed == 'true'
        run: bash ./scripts/clone_db.sh notification-service ${{ inputs.pr_number }}
