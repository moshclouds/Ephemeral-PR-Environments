version: '3.8'

services:
  # ==========================================
  # Databases
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"

  mongo-db:
    image: mongo:6-jammy
    ports:
      - "27017:27017"

  # ==========================================
  # Applications
  # ==========================================
  order-service:
    build:
      context: ./app/order-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://user:password@postgres-db:5432/order_db?schema=public
    depends_on:
      - postgres-db

  inventory-service:
    build:
      context: ./app/inventory-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=mysql://root:password@mysql-db:3306/inventory_db
    depends_on:
      - mysql-db

  notification-service:
    build:
      context: ./app/notification-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=mongodb://mongo-db:27017/notification_db?authSource=admin
    depends_on:
      - mongo-db
